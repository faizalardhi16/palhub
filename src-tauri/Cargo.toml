[package]
name = "palhub"
version = "0.1.0"
description = "Desktop skills hub for AI coding tools"
edition = "2021"

[lib]
name = "palhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
thiserror = "2"
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
